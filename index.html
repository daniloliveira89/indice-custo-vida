<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Índice de Viabilidade Econômica (IVFR)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
    .container { max-width: 1200px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.3rem 0; }
    p.sub { color: #94a3b8; font-size: 0.85rem; margin: 0; }
    
    .top-actions { display: flex; gap: 0.5rem; align-items: center; }
    select.lang-select { background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 0.4rem 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-settings { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 0.4rem 0.7rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-settings:hover { color: #fff; background: #334155; }

    .token-modal { display: none; background: #020617; border: 1px solid #334155; padding: 1rem; border-radius: 8px; margin-bottom: 1.2rem; }
    .token-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

    .card { background: #1e293b; padding: 1.2rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid #334155; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 0.8rem; }
    label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.2rem; }
    input { width: 100%; padding: 0.45rem; background: #334155; border: 1px solid #475569; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 0.85rem; }
    
    .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; align-items: center; }
    button.btn-main { background: #2563eb; color: #fff; border: none; padding: 0.55rem 1rem; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    button.btn-main:hover { background: #1d4ed8; }
    button.btn-sec { background: #059669; color: #fff; border: none; padding: 0.45rem 0.8rem; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    button.btn-sec:hover { background: #047857; }
    button.btn-cancel { background: #991b1b; color: #fff; border: none; padding: 0.55rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; display: none; }

    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; border: 1px solid #334155; }
    th, td { padding: 0.75rem 0.9rem; text-align: left; border-bottom: 1px solid #334155; font-size: 0.85rem; }
    th { background: #020617; color: #94a3b8; user-select: none; cursor: pointer; transition: color 0.15s; }
    th:hover { color: #f8fafc; background: #0f172a; }
    th.no-sort { cursor: default; }
    th.no-sort:hover { background: #020617; color: #94a3b8; }
    
    .flag { font-size: 1.25rem; margin-right: 0.4rem; vertical-align: middle; }
    .score { font-size: 0.95rem; font-weight: bold; }
    .score-high { color: #4ade80; } /* Verde >= 5.0 */
    .score-mid { color: #facc15; }  /* Amarelo 2.0 - 4.9 */
    .score-low { color: #f87171; }  /* Vermelho < 2.0 */
    
    .btn-action { background: #334155; color: #94a3b8; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; margin-right: 0.2rem; }
    .btn-action:hover { background: #475569; color: #fff; }
    .btn-delete:hover { background: #ef4444; color: #fff; }

    .status-msg { font-size: 0.85rem; color: #4ade80; display: none; }

    /* Tooltips */
    .has-tooltip { position: relative; border-bottom: 1px dotted #64748b; }
    .has-tooltip:hover::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: 125%;
      left: 50%;
      transform: translateX(-50%);
      background: #020617;
      color: #f8fafc;
      padding: 0.5rem 0.7rem;
      border-radius: 6px;
      font-size: 0.75rem;
      white-space: normal;
      width: max-content;
      max-width: 250px;
      z-index: 100;
      border: 1px solid #475569;
      line-height: 1.3;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 id="txtTitle">Índice de Viabilidade Econômica (IVFR)</h1>
        <p class="sub" id="txtSubtitle">Controle de qualidade econômica real por poder de compra e despesas correntes.</p>
      </div>
      <div class="top-actions">
        <select id="langSelector" class="lang-select" onchange="mudarIdioma(this.value)">
          <option value="pt">🇧🇷 Português</option>
          <option value="en">🇺🇸 English</option>
          <option value="es">🇪🇸 Español</option>
        </select>
        <button class="btn-settings" onclick="toggleSettings()">⚙️ <span id="txtBtnSettings">GitHub</span></button>
      </div>
    </div>

    <div id="tokenModal" class="token-modal">
      <label id="txtTokenLabel" style="font-size:0.8rem; color:#cbd5e1;">GitHub Personal Access Token (PAT):</label>
      <div class="token-row">
        <input id="ghToken" type="password" placeholder="github_pat_..." style="flex:1;">
        <button class="btn-sec" onclick="salvarToken()" id="txtBtnSaveToken">Salvar Token</button>
      </div>
    </div>
    
    <div class="card">
      <input type="hidden" id="editIndex" value="-1">
      <div class="grid">
        <div><label id="lblFlag">Bandeira</label><input id="bandeira" value="🌐" maxlength="4"></div>
        <div><label id="lblCountry">País / Região</label><input id="pais" value="Novo País"></div>
        <div><label id="lblSalary">Salário Líq.</label><input id="salario" type="number" value="3000"></div>
        <div><label id="lblRent">Aluguel</label><input id="aluguel" type="number" value="1000"></div>
        <div><label id="lblCarInstallment">Parcela Carro</label><input id="parcela" type="number" value="300"></div>
        <div><label id="lblFood">Alimentação</label><input id="alimentacao" type="number" value="400"></div>
        <div><label id="lblCarDown">Entrada Carro</label><input id="entrada" type="number" value="4000"></div>
        <div><label id="lblTech">Eletrônico Ref.</label><input id="eletronico" type="number" value="1000"></div>
      </div>
      <div class="btn-group">
        <button id="btnSubmit" class="btn-main" onclick="salvarPais()">Salvar e Gravar no GitHub</button>
        <button id="btnCancel" class="btn-cancel" onclick="cancelarEdicao()">Cancelar</button>
        <span id="statusMsg" class="status-msg">Gravando...</span>
      </div>
    </div>

    <table id="tabela">
      <thead>
        <tr>
          <th onclick="ordenarColuna('pais')"><span id="thCountry">País</span> <span id="sort_pais">↕</span></th>
          <th onclick="ordenarColuna('salario')"><span id="thSalary">Salário Líq.</span> <span id="sort_salario">↕</span></th>
          <th onclick="ordenarColuna('custoFixo')"><span id="thFixed">Custo Fixo</span> <span id="sort_custoFixo">↕</span></th>
          <th onclick="ordenarColuna('sobra')"><span id="thSurplus">Sobra Líquida</span> <span id="sort_sobra">↕</span></th>
          <th onclick="ordenarColuna('margem')"><span id="thMargin">Margem Livre</span> <span id="sort_margem">↕</span></th>
          <th onclick="ordenarColuna('mesesBens')"><span class="has-tooltip" id="thMonths">Meses p/ Bens</span> <span id="sort_mesesBens">↕</span></th>
          <th onclick="ordenarColuna('ivfr')"><span class="has-tooltip" id="thIvfr">Fator IVFR (0-100)</span> <span id="sort_ivfr">↕</span></th>
          <th class="no-sort" id="thActions">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaCorpo"></tbody>
    </table>
  </div>

  <script>
    const USUARIO = "daniloliveira89";
    const REPO = "indice-custo-vida";
    const ARQUIVO = "dados.json";

    const i18n = {
      pt: {
        title: "Índice de Viabilidade Econômica (IVFR)",
        subtitle: "Controle de qualidade econômica real por poder de compra e despesas correntes.",
        btnSettings: "GitHub",
        tokenLabel: "GitHub Personal Access Token (PAT):",
        btnSaveToken: "Salvar Token",
        lblFlag: "Bandeira",
        lblCountry: "País / Região",
        lblSalary: "Salário Líq.",
        lblRent: "Aluguel",
        lblCarInstallment: "Parcela Carro",
        lblFood: "Alimentação",
        lblCarDown: "Entrada Carro",
        lblTech: "Eletrônico Ref.",
        btnSubmitAdd: "Salvar e Gravar no GitHub",
        btnSubmitUpdate: "Atualizar e Gravar",
        btnCancel: "Cancelar",
        thCountry: "País",
        thSalary: "Salário Líq.",
        thFixed: "Custo Fixo",
        thSurplus: "Sobra Líquida",
        thMargin: "Margem Livre",
        thMonths: "Meses p/ Bens",
        thMonthsTooltip: "Meses de sobra líquida necessários para comprar 1 eletrônico de referência e pagar a entrada de um carro popular.",
        thIvfr: "Fator IVFR (0-100)",
        thIvfrTooltip: "Índice sintético (0 a 100) que pondera a margem livre retida e penaliza o tempo de acesso a bens duráveis.",
        thActions: "Ações",
        btnEdit: "Editar",
        btnDelete: "✕",
        msgInfeasible: "Inviável",
        msgSaving: "Gravando no GitHub...",
        msgSaved: "✔️ Gravado no GitHub!",
        msgError: "Erro ao gravar. Verifique o token.",
        confirmDelete: "Deseja remover "
      },
      en: {
        title: "Economic Viability Index (IVFR)",
        subtitle: "Real economic quality analysis based on purchasing power and fixed living costs.",
        btnSettings: "GitHub",
        tokenLabel: "GitHub Personal Access Token (PAT):",
        btnSaveToken: "Save Token",
        lblFlag: "Flag",
        lblCountry: "Country / City",
        lblSalary: "Net Salary",
        lblRent: "Rent",
        lblCarInstallment: "Car Installment",
        lblFood: "Groceries",
        lblCarDown: "Car Down Payment",
        lblTech: "Reference Tech",
        btnSubmitAdd: "Save and Commit to GitHub",
        btnSubmitUpdate: "Update and Commit",
        btnCancel: "Cancel",
        thCountry: "Country",
        thSalary: "Net Salary",
        thFixed: "Fixed Costs",
        thSurplus: "Net Surplus",
        thMargin: "Free Margin",
        thMonths: "Months to Goods",
        thMonthsTooltip: "Months of net surplus required to buy reference electronics and pay the down payment for a car.",
        thIvfr: "IVFR Factor (0-100)",
        thIvfrTooltip: "Synthetic score (0 to 100) that balances free retained cashflow and penalizes the time required to acquire capital assets.",
        thActions: "Actions",
        btnEdit: "Edit",
        btnDelete: "✕",
        msgInfeasible: "Infeasible",
        msgSaving: "Committing to GitHub...",
        msgSaved: "✔️ Saved to GitHub!",
        msgError: "Error saving. Check token permissions.",
        confirmDelete: "Delete "
      },
      es: {
        title: "Índice de Viabilidad Económica (IVFR)",
        subtitle: "Control de calidad económica real según poder adquisitivo y gastos corrientes.",
        btnSettings: "GitHub",
        tokenLabel: "GitHub Personal Access Token (PAT):",
        btnSaveToken: "Guardar Token",
        lblFlag: "Bandera",
        lblCountry: "País / Región",
        lblSalary: "Salario Neto",
        lblRent: "Alquiler",
        lblCarInstallment: "Cuota Coche",
        lblFood: "Alimentación",
        lblCarDown: "Entrada Coche",
        lblTech: "Electrónica Ref.",
        btnSubmitAdd: "Guardar en GitHub",
        btnSubmitUpdate: "Actualizar en GitHub",
        btnCancel: "Cancelar",
        thCountry: "País",
        thSalary: "Salario Neto",
        thFixed: "Coste Fijo",
        thSurplus: "Sobrante Neto",
        thMargin: "Margen Libre",
        thMonths: "Meses para Bienes",
        thMonthsTooltip: "Meses de ahorro neto necesarios para adquirir electrónica de referencia y la entrada de un coche.",
        thIvfr: "Factor IVFR (0-100)",
        thIvfrTooltip: "Índice sintético (0 a 100) que pondera el margen libre retenido y penaliza el tiempo de acceso a bienes duraderos.",
        thActions: "Acciones",
        btnEdit: "Editar",
        btnDelete: "✕",
        msgInfeasible: "Inviable",
        msgSaving: "Guardando en GitHub...",
        msgSaved: "✔️ ¡Guardado en GitHub!",
        msgError: "Error al guardar. Revise el token.",
        confirmDelete: "¿Eliminar "
      }
    };

    let idiomaAtual = localStorage.getItem("ivfr_lang") || "pt";
    let baseDados = [];
    let fileSha = "";
    let colunaOrdenada = "ivfr";
    let ordemAscendente = false;

    function mudarIdioma(lang) {
      idiomaAtual = lang;
      localStorage.setItem("ivfr_lang", lang);
      document.getElementById("langSelector").value = lang;
      const t = i18n[lang];

      document.getElementById("txtTitle").innerText = t.title;
      document.getElementById("txtSubtitle").innerText = t.subtitle;
      document.getElementById("txtBtnSettings").innerText = t.btnSettings;
      document.getElementById("txtTokenLabel").innerText = t.tokenLabel;
      document.getElementById("txtBtnSaveToken").innerText = t.btnSaveToken;
      document.getElementById("lblFlag").innerText = t.lblFlag;
      document.getElementById("lblCountry").innerText = t.lblCountry;
      document.getElementById("lblSalary").innerText = t.lblSalary;
      document.getElementById("lblRent").innerText = t.lblRent;
      document.getElementById("lblCarInstallment").innerText = t.lblCarInstallment;
      document.getElementById("lblFood").innerText = t.lblFood;
      document.getElementById("lblCarDown").innerText = t.lblCarDown;
      document.getElementById("lblTech").innerText = t.lblTech;
      document.getElementById("btnSubmit").innerText = document.getElementById("editIndex").value === "-1" ? t.btnSubmitAdd : t.btnSubmitUpdate;
      document.getElementById("btnCancel").innerText = t.btnCancel;
      
      document.getElementById("thCountry").innerText = t.thCountry;
      document.getElementById("thSalary").innerText = t.thSalary;
      document.getElementById("thFixed").innerText = t.thFixed;
      document.getElementById("thSurplus").innerText = t.thSurplus;
      document.getElementById("thMargin").innerText = t.thMargin;
      document.getElementById("thMonths").innerText = t.thMonths;
      document.getElementById("thMonths").setAttribute("data-tooltip", t.thMonthsTooltip);
      document.getElementById("thIvfr").innerText = t.thIvfr;
      document.getElementById("thIvfr").setAttribute("data-tooltip", t.thIvfrTooltip);
      document.getElementById("thActions").innerText = t.thActions;

      renderizarTabela();
    }

    function toggleSettings() {
      const modal = document.getElementById("tokenModal");
      modal.style.display = modal.style.display === "block" ? "none" : "block";
    }

    function calcularValoresCompletos(item) {
      const custoFixo = (item.aluguel || 0) + (item.parcela || 0) + (item.alimentacao || 0);
      const sobra = (item.salario || 0) - custoFixo;
      const t = i18n[idiomaAtual];

      if (sobra <= 0) {
        return {
          ...item,
          custoFixo,
          sobra,
          margem: 0,
          margemStr: "0.0%",
          mesesBens: 999,
          mesesBensStr: t.msgInfeasible,
          ivfr: 0.0,
          classe: "score-low"
        };
      }

      const margem = sobra / item.salario;
      const custoBens = (item.entrada || 0) + (item.eletronico || 0);
      const mesesBens = custoBens / sobra;
      
      const penalidadeTempo = 1 / (1 + Math.log(1 + mesesBens));
      const ivfr = Math.min(100, Math.max(0, margem * 100 * penalidadeTempo * 1.5));

      // Destaque Verde >= 5.0
      let classe = "score-low";
      if (ivfr >= 5.0) {
        classe = "score-high";
      } else if (ivfr >= 2.0) {
        classe = "score-mid";
      }

      return {
        ...item,
        custoFixo,
        sobra,
        margem,
        margemStr: (margem * 100).toFixed(1) + "%",
        mesesBens,
        mesesBensStr: mesesBens.toFixed(1) + " m",
        ivfr: parseFloat(ivfr.toFixed(1)),
        classe
      };
    }

    function ordenarColuna(campo) {
      if (colunaOrdenada === campo) {
        ordemAscendente = !ordemAscendente;
      } else {
        colunaOrdenada = campo;
        ordemAscendente = campo === "pais" ? true : false;
      }
      renderizarTabela();
    }

    function renderizarTabela() {
      const tbody = document.getElementById("tabelaCorpo");
      tbody.innerHTML = "";
      const t = i18n[idiomaAtual];

      // Atualiza setas no cabeçalho
      ["pais", "salario", "custoFixo", "sobra", "margem", "mesesBens", "ivfr"].forEach(col => {
        const el = document.getElementById("sort_" + col);
        if (el) {
          el.innerText = (colunaOrdenada === col) ? (ordemAscendente ? "▲" : "▼") : "↕";
          el.style.color = (colunaOrdenada === col) ? "#4ade80" : "#64748b";
        }
      });

      // Processa e ordena
      let dadosProcessados = baseDados.map((item, originalIndex) => ({
        ...calcularValoresCompletos(item),
        originalIndex
      }));

      dadosProcessados.sort((a, b) => {
        let vA = a[colunaOrdenada];
        let vB = b[colunaOrdenada];

        if (typeof vA === "string") {
          return ordemAscendente ? vA.localeCompare(vB) : vB.localeCompare(vA);
        }
        return ordemAscendente ? (vA - vB) : (vB - vA);
      });

      dadosProcessados.forEach(item => {
        tbody.insertAdjacentHTML("beforeend", `
          <tr>
            <td><span class="flag">${item.bandeira || "🌐"}</span><strong>${item.pais}</strong></td>
            <td>${item.salario.toLocaleString()}</td>
            <td>${item.custoFixo.toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
            <td class="${item.classe}"><strong>${item.sobra.toLocaleString(undefined, {maximumFractionDigits: 0})}</strong></td>
            <td>${item.margemStr}</td>
            <td>${item.mesesBensStr}</td>
            <td><span class="score ${item.classe}">${item.ivfr.toFixed(1)}</span> / 100</td>
            <td>
              <button class="btn-action" onclick="carregarParaEdicao(${item.originalIndex})">${t.btnEdit}</button>
              <button class="btn-action btn-delete" onclick="removerPais(${item.originalIndex})">${t.btnDelete}</button>
            </td>
          </tr>
        `);
      });
    }

    async function carregarDoGitHub() {
      try {
        const res = await fetch(`https://api.github.com/repos/${USUARIO}/${REPO}/contents/${ARQUIVO}?t=${Date.now()}`);
        const data = await res.json();
        fileSha = data.sha;
        const jsonText = decodeURIComponent(escape(atob(data.content)));
        baseDados = JSON.parse(jsonText);
        renderizarTabela();
      } catch (err) {
        console.warn("Aguardando carregamento de base do GitHub.");
      }
    }

    async function gravarNoGitHub() {
      const token = localStorage.getItem("gh_pat");
      const msg = document.getElementById("statusMsg");
      const t = i18n[idiomaAtual];
      
      if (!token) {
        alert(t.tokenLabel);
        return;
      }

      msg.style.display = "inline";
      msg.style.color = "#facc15";
      msg.innerText = t.msgSaving;

      const conteudoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(baseDados, null, 2))));

      try {
        const res = await fetch(`https://api.github.com/repos/${USUARIO}/${REPO}/contents/${ARQUIVO}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Atualização de dados via dashboard web",
            content: conteudoBase64,
            sha: fileSha
          })
        });

        if (res.ok) {
          const result = await res.json();
          fileSha = result.content.sha;
          msg.style.color = "#4ade80";
          msg.innerText = t.msgSaved;
        } else {
          msg.style.color = "#f87171";
          msg.innerText = t.msgError;
        }
      } catch (e) {
        msg.style.color = "#f87171";
        msg.innerText = t.msgError;
      }

      setTimeout(() => { msg.style.display = "none"; }, 4000);
    }

    function salvarPais() {
      const index = parseInt(document.getElementById("editIndex").value);
      const dados = {
        bandeira: document.getElementById("bandeira").value || "🌐",
        pais: document.getElementById("pais").value,
        salario: parseFloat(document.getElementById("salario").value) || 0,
        aluguel: parseFloat(document.getElementById("aluguel").value) || 0,
        parcela: parseFloat(document.getElementById("parcela").value) || 0,
        alimentacao: parseFloat(document.getElementById("alimentacao").value) || 0,
        entrada: parseFloat(document.getElementById("entrada").value) || 0,
        eletronico: parseFloat(document.getElementById("eletronico").value) || 0
      };

      if (index >= 0) baseDados[index] = dados;
      else baseDados.push(dados);

      cancelarEdicao();
      renderizarTabela();
      gravarNoGitHub();
    }

    function removerPais(index) {
      const t = i18n[idiomaAtual];
      if (confirm(`${t.confirmDelete}${baseDados[index].pais}?`)) {
        baseDados.splice(index, 1);
        renderizarTabela();
        gravarNoGitHub();
      }
    }

    function carregarParaEdicao(index) {
      const item = baseDados[index];
      const t = i18n[idiomaAtual];
      document.getElementById("editIndex").value = index;
      document.getElementById("bandeira").value = item.bandeira || "🌐";
      document.getElementById("pais").value = item.pais;
      document.getElementById("salario").value = item.salario;
      document.getElementById("aluguel").value = item.aluguel;
      document.getElementById("parcela").value = item.parcela;
      document.getElementById("alimentacao").value = item.alimentacao;
      document.getElementById("entrada").value = item.entrada;
      document.getElementById("eletronico").value = item.eletronico;

      document.getElementById("btnSubmit").innerText = t.btnSubmitUpdate;
      document.getElementById("btnCancel").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicao() {
      const t = i18n[idiomaAtual];
      document.getElementById("editIndex").value = "-1";
      document.getElementById("btnSubmit").innerText = t.btnSubmitAdd;
      document.getElementById("btnCancel").style.display = "none";
    }

    function salvarToken() {
      const t = document.getElementById("ghToken").value.trim();
      if (t) {
        localStorage.setItem("gh_pat", t);
        document.getElementById("tokenModal").style.display = "none";
        carregarDoGitHub();
      }
    }

    // Inicialização
    const tokenSalvo = localStorage.getItem("gh_pat");
    if (tokenSalvo) document.getElementById("ghToken").value = tokenSalvo;
    mudarIdioma(idiomaAtual);
    carregarDoGitHub();
