<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Global Cost of Living & Delivery Driver Savings</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --accent: #38bdf8;
      --success: #22c55e;
      --danger: #ef4444;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
    }
    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .auth-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    .auth-panel input {
      background: #0f172a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    button {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    .table-container {
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      text-align: left;
    }
    th, td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    th {
      background: #182234;
      color: var(--text-muted);
      position: sticky;
      top: 0;
    }
    td.editable {
      background: rgba(56, 189, 248, 0.04);
      outline: none;
      cursor: text;
    }
    td.editable:focus {
      background: rgba(56, 189, 248, 0.15);
      box-shadow: inset 0 0 0 1px var(--accent);
    }
    .tooltip-header {
      cursor: help;
      text-decoration: underline dotted var(--accent);
      color: var(--accent);
    }
    .status-msg {
      margin-left: 8px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .infinity {
      color: var(--danger);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="header-container">
    <h1 id="page-title">Comparador de Poupança Global</h1>
    <div>
      <select id="lang-select" onchange="changeLanguage(this.value)" style="background: var(--card-bg); color: var(--text); border: 1px solid var(--border); padding: 6px 12px; border-radius: 6px;">
        <option value="pt" selected>Português (PT)</option>
        <option value="en">English (EN)</option>
        <option value="es">Español (ES)</option>
      </select>
    </div>
  </div>

  <div class="auth-panel">
    <input type="text" id="gh-owner" placeholder="Usuário GitHub (ex: danilo)" size="18">
    <input type="text" id="gh-repo" placeholder="Repositório (ex: app)" size="18">
    <input type="password" id="gh-token" placeholder="GitHub Personal Access Token" size="26">
    <button id="btn-save" onclick="commitChangesToGitHub()">Salvar no GitHub</button>
    <span id="save-status" class="status-msg"></span>
  </div>

  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th id="th-country">País / Cidade</th>
          <th id="th-salary">Salário ($) ✎</th>
          <th id="th-rent">Aluguel ($) ✎</th>
          <th id="th-living">Despesas Fixas</th>
          <th id="th-net">Sobra Mensal</th>
          <th id="th-car-down" class="tooltip-header">Months to Car Down ℹ️</th>
          <th id="th-house-down" class="tooltip-header">Months to House Down ℹ️</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>

  <script>
    let dataset = [];
    let currentLang = "pt";

    const i18n = {
      pt: {
        title: "Comparador de Poupança Global",
        country: "País / Cidade",
        salary: "Salário ($) ✎",
        rent: "Aluguel ($) ✎",
        living: "Despesas Fixas",
        net: "Sobra Líquida",
        carDown: "Meses Entrada Carro ℹ️",
        houseDown: "Meses Entrada Casa ℹ️",
        carDownTooltip: "Meses de poupança líquida necessários para pagar a entrada de um Toyota Corolla Sedan (Híbrido) 2026 0km, considerando a menor taxa de entrada do mercado local.",
        houseDownTooltip: "Meses de poupança necessários para cobrir 20% de entrada de um imóvel residencial padrão.",
        saveBtn: "Salvar no GitHub",
        checking: "Consultando SHA atual...",
        saving: "Gravando commit no GitHub...",
        success: "Arquivo dados.json atualizado com sucesso!",
        error: "Erro ao salvar: "
      },
      en: {
        title: "Global Delivery Driver Savings Comparator",
        country: "Country / City",
        salary: "Salary ($) ✎",
        rent: "Rent ($) ✎",
        living: "Living Costs",
        net: "Net Savings",
        carDown: "Months to Car Down ℹ️",
        houseDown: "Months to House Down ℹ️",
        carDownTooltip: "Months of net monthly savings needed to pay the down payment on a brand new 2026 Toyota Corolla Sedan (Hybrid), based on minimum local financing rates.",
        houseDownTooltip: "Months of net savings needed to afford a 20% home down payment.",
        saveBtn: "Save to GitHub",
        checking: "Checking file SHA...",
        saving: "Committing changes...",
        success: "dados.json successfully updated!",
        error: "Save error: "
      },
      es: {
        title: "Comparador Global de Ahorro",
        country: "País / Ciudad",
        salary: "Salario ($) ✎",
        rent: "Alquiler ($) ✎",
        living: "Gastos Fijos",
        net: "Ahorro Neto",
        carDown: "Meses Entrada Coche ℹ️",
        houseDown: "Meses Entrada Casa ℹ️",
        carDownTooltip: "Meses de ahorro neto necesarios para pagar la entrada de un Toyota Corolla Sedan (Híbrido) 2026 0km, según la tasa mínima de enganche del mercado local.",
        houseDownTooltip: "Meses de ahorro necesarios para cubrir el 20% de enganche de una vivienda típica.",
        saveBtn: "Guardar en GitHub",
        checking: "Consultando SHA...",
        saving: "Guardando commit...",
        success: "¡dados.json actualizado con éxito!",
        error: "Error al guardar: "
      }
    };

    async function loadData() {
      try {
        const res = await fetch(`dados.json?_nocache=${Date.now()}`);
        dataset = await res.json();
      } catch (err) {
        console.error("Falha ao carregar dados.json", err);
      }
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById("table-body");
      tbody.innerHTML = "";

      dataset.forEach((item, index) => {
        const livingCosts = (item.alimentacao || 0) + (item.internet || 0) + (item.academia || 0) + (item.extras || 0);
        const netSavings = item.salario - (item.aluguel + livingCosts);
        
        let monthsCar = "Infinity";
        if (netSavings > 0 && item.entrada > 0) {
          monthsCar = (item.entrada / netSavings).toFixed(1);
        }

        let monthsHouse = "Infinity";
        if (netSavings > 0 && item.entrada_casa_20pct > 0) {
          monthsHouse = (item.entrada_casa_20pct / netSavings).toFixed(1);
        }

        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.bandeira || ""} ${item.cidade}, ${item.paisNome}</td>
          <td class="editable" contenteditable="true" onblur="updateRow(${index}, 'salario', this.innerText)">${item.salario}</td>
          <td class="editable" contenteditable="true" onblur="updateRow(${index}, 'aluguel', this.innerText)">${item.aluguel}</td>
          <td>$${livingCosts.toLocaleString()}</td>
          <td style="color:${netSavings > 0 ? '#4ade80' : '#f87171'}">$${netSavings.toLocaleString()}</td>
          <td class="${monthsCar === 'Infinity' ? 'infinity' : ''}">${monthsCar}</td>
          <td class="${monthsHouse === 'Infinity' ? 'infinity' : ''}">${monthsHouse}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updateRow(index, field, value) {
      const parsed = parseFloat(value.replace(/[^0-9.-]+/g, "")) || 0;
      dataset[index][field] = parsed;
      renderTable();
    }

    async function commitChangesToGitHub() {
      const owner = document.getElementById("gh-owner").value.trim();
      const repo = document.getElementById("gh-repo").value.trim();
      const token = document.getElementById("gh-token").value.trim();
      const statusEl = document.getElementById("save-status");
      const t = i18n[currentLang];

      if (!owner || !repo || !token) {
        alert("Preencha Usuário, Repositório e Token para salvar.");
        return;
      }

      statusEl.style.color = "var(--accent)";
      statusEl.innerText = t.checking;

      try {
        const url = `https://api.github.com/repos/${owner}/${repo}/contents/dados.json`;

        // 1. Obter o SHA mais atual do arquivo no GitHub
        const getRes = await fetch(`${url}?_nocache=${Date.now()}`, {
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json"
          }
        });

        let currentSha = null;
        if (getRes.ok) {
          const fileData = await getRes.json();
          currentSha = fileData.sha;
        } else if (getRes.status !== 404) {
          const errData = await getRes.json();
          throw new Error(`GET (${getRes.status}): ${errData.message}`);
        }

        // 2. Codificação segura UTF-8 para Base64 (sem quebrar emojis ou acentos)
        const jsonStr = JSON.stringify(dataset, null, 2);
        const utf8Bytes = new TextEncoder().encode(jsonStr);
        let binaryStr = "";
        utf8Bytes.forEach(b => binaryStr += String.fromCharCode(b));
        const contentBase64 = btoa(binaryStr);

        statusEl.innerText = t.saving;

        // 3. Gravar commit via PUT
        const putRes = await fetch(url, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Accept": "application/vnd.github+json",
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Atualização de dados via dashboard web",
            content: contentBase64,
            sha: currentSha
          })
        });

        if (!putRes.ok) {
          const errData = await putRes.json();
          throw new Error(`PUT (${putRes.status}): ${errData.message}`);
        }

        statusEl.style.color = "var(--success)";
        statusEl.innerText = t.success;
      } catch (err) {
        statusEl.style.color = "var(--danger)";
        statusEl.innerText = t.error + err.message;
        console.error("GitHub Commit Error:", err);
      }
    }

    function changeLanguage(lang) {
      currentLang = lang;
      const t = i18n[lang] || i18n.pt;
      document.documentElement.lang = lang;
      document.getElementById("page-title").innerText = t.title;
      document.getElementById("th-country").innerText = t.country;
      document.getElementById("th-salary").innerText = t.salary;
      document.getElementById("th-rent").innerText = t.rent;
      document.getElementById("th-living").innerText = t.living;
      document.getElementById("th-net").innerText = t.net;
      document.getElementById("btn-save").innerText = t.saveBtn;
      
      const thCar = document.getElementById("th-car-down");
      thCar.innerText = t.carDown;
      thCar.title = t.carDownTooltip;

      const thHouse = document.getElementById("th-house-down");
      thHouse.innerText = t.houseDown;
      thHouse.title = t.houseDownTooltip;
    }

    // Inicialização
    changeLanguage("pt");
    loadData();
  </script>
</body>
</html>
