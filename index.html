<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Índice de Viabilidade Econômica (IVFR)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --subtext: #94a3b8;
      --border: #334155;
      --input-bg: #334155;
      --input-border: #475569;
      --th-bg: #020617;
      --th-hover: #0f172a;
      --modal-bg: #020617;
      --score-high: #4ade80;
      --score-mid: #facc15;
      --score-low: #f87171;
    }

    body.light-theme {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --subtext: #64748b;
      --border: #cbd5e1;
      --input-bg: #f8fafc;
      --input-border: #cbd5e1;
      --th-bg: #e2e8f0;
      --th-hover: #cbd5e1;
      --modal-bg: #ffffff;
      --score-high: #16a34a;
      --score-mid: #ca8a04;
      --score-low: #dc2626;
    }

    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; margin: 0; transition: background 0.2s, color 0.2s; }
    .container { max-width: 1350px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.3rem 0; }
    p.sub { color: var(--subtext); font-size: 0.85rem; margin: 0; }
    
    .top-right-panel { display: flex; flex-direction: column; align-items: flex-end; gap: 0.35rem; }
    .top-actions { display: flex; gap: 0.4rem; align-items: center; }
    select.lang-select, .btn-icon { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.95rem; }
    .btn-icon:hover, select.lang-select:hover { background: var(--border); }
    .last-update { font-size: 0.75rem; color: var(--subtext); }

    .token-modal { display: none; background: var(--modal-bg); border: 1px solid var(--border); padding: 1rem; border-radius: 8px; margin-bottom: 1.2rem; }
    .token-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

    .card { background: var(--card-bg); padding: 1.2rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid var(--border); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(95px, 1fr)); gap: 0.6rem; }
    label { display: block; font-size: 0.75rem; color: var(--subtext); margin-bottom: 0.2rem; }
    input { width: 100%; padding: 0.45rem; background: var(--input-bg); border: 1px solid var(--input-border); color: var(--text); border-radius: 4px; box-sizing: border-box; font-size: 0.85rem; }
    
    .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; align-items: center; }
    button.btn-main { background: #2563eb; color: #fff; border: none; padding: 0.45rem 0.85rem; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    button.btn-main:hover { background: #1d4ed8; }
    button.btn-sec { background: #059669; color: #fff; border: none; padding: 0.45rem 0.8rem; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    button.btn-sec:hover { background: #047857; }
    button.btn-cancel { background: #991b1b; color: #fff; border: none; padding: 0.45rem 0.85rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; display: none; }

    table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: 8px; border: 1px solid var(--border); }
    th, td { padding: 0.75rem 0.7rem; text-align: left; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
    th { background: var(--th-bg); color: var(--subtext); user-select: none; cursor: pointer; }
    th:hover { color: var(--text); background: var(--th-hover); }
    th.no-sort { cursor: default; }
    th.no-sort:hover { background: var(--th-bg); color: var(--subtext); }
    
    .flag { font-size: 1.2rem; margin-right: 0.35rem; vertical-align: middle; }
    .score { font-size: 0.95rem; font-weight: bold; }
    .score-high { color: var(--score-high); }
    .score-mid { color: var(--score-mid); }
    .score-low { color: var(--score-low); }
    
    .btn-action { background: var(--input-bg); color: var(--subtext); border: none; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; margin-right: 0.2rem; }
    .btn-action:hover { background: var(--border); color: var(--text); }
    .btn-delete:hover { background: #ef4444; color: #fff; }

    .status-msg { font-size: 0.85rem; color: var(--score-high); display: none; }

    .has-tooltip { border-bottom: 1px dotted var(--subtext); display: inline-block; cursor: pointer; }
    label .has-tooltip { cursor: default; }
    
    #globalTooltip {
      position: fixed;
      display: none;
      background: var(--modal-bg);
      color: var(--text);
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      border: 1px solid var(--border);
      line-height: 1.35;
      z-index: 999999;
      max-width: 270px;
      pointer-events: none;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
    }
  </style>
</head>

    <div class="card">

      <div class="grid">
        <div style="max-width:65px"><label id="lblFlag">Bandeira</label><input id="bandeira" value="🌐" maxlength="4"></div>
        <div><label id="lblCity">Cidade</label><input id="cidade" value="Nova Cidade"></div>
        <div style="max-width:65px"><label id="lblCurrency">Moeda</label><input id="moeda" value="$" maxlength="5"></div>

        <div><label id="lblFood">Comida</label><input id="alimentacao" type="number" value="400"></div>
        <div><label id="lblInternet">Internet</label><input id="internet" type="number" value="50"></div>
        <div><label id="lblGym">Academia</label><input id="academia" type="number" value="40"></div>

      <div class="btn-group">

    function normalizarItem(item) {
      let cidadeNome = item.cidade || item.pais || "Cidade";
      let moeda = item.moeda || "$";
      return {
        ...item,
        cidade: cidadeNome,
        moeda: moeda,
        internet: item.internet || 0,
        academia: item.academia || 0,
        extras: item.extras || 0,
        iphone: item.iphone || item.eletronico || 1000,
        entrada: item.entrada || 4000
      };
    }

    function atualizarBotaoTema() {
      const isLight = document.body.classList.contains("light-theme");
      document.getElementById("btnTheme").innerText = isLight ? "🌙" : "☀️";
    }

    function alternarTema() {
      document.body.classList.toggle("light-theme");
      const temaAtual = document.body.classList.contains("light-theme") ? "light" : "dark";
      localStorage.setItem("ivfr_theme", temaAtual);
      atualizarBotaoTema();
    }

    if (localStorage.getItem("ivfr_theme") === "light") {
      document.body.classList.add("light-theme");
    }

    function toggleSettings() {
      const modal = document.getElementById("tokenModal");
      modal.style.display = modal.style.display === "block" ? "none" : "block";
    }

    function calcularValoresCompletos(item) {
      const custoFixo = (item.aluguel || 0) + (item.alimentacao || 0) + (item.internet || 0) + (item.academia || 0) + (item.extras || 0) + (item.parcela || 0);
      const sobra = (item.salario || 0) - custoFixo;
      const t = i18n[idiomaAtual];

      if (sobra <= 0) {
        return {
          ...item,
          custoFixo,
          sobra,
          margem: 0,
          margemStr: "0.0%",
          mesesIphone: 999,
          mesesIphoneStr: t.msgInfeasible,
          mesesCarro: 999,
          mesesCarroStr: t.msgInfeasible,
          ivfr: 0.0,
          classe: "score-low"
        };
      }

      const margem = sobra / item.salario;
      const precoIphone = item.iphone || 1000;
      const precoEntrada = item.entrada || 4000;
      
      const mesesIphone = precoIphone / sobra;
      const mesesCarro = precoEntrada / sobra;
      const tempoTotalBens = (precoIphone + precoEntrada) / sobra;
      
      const penalidadeTempo = 1 / (1 + Math.log(1 + tempoTotalBens));
      const ivfr = Math.min(100, Math.max(0, margem * 100 * penalidadeTempo * 1.5));

      let classe = "score-low";
      if (ivfr >= 5.0) classe = "score-high";
      else if (ivfr >= 2.0) classe = "score-mid";

      return {
        ...item,
        custoFixo,
        sobra,
        margem,
        margemStr: (margem * 100).toFixed(1) + "%",
        mesesIphone,
        mesesIphoneStr: mesesIphone.toFixed(1) + " m",
        mesesCarro,
        mesesCarroStr: mesesCarro.toFixed(1) + " m",
        ivfr: parseFloat(ivfr.toFixed(1)),
        classe
      };
    }

    function ordenarColuna(campo) {
      if (colunaOrdenada === campo) {
        ordemAscendente = !ordemAscendente;
      } else {
        colunaOrdenada = campo;
        ordemAscendente = campo === "cidade" ? true : false;
      }
      renderizarTabela();
    }

    function renderizarTabela() {
      const tbody = document.getElementById("tabelaCorpo");
      tbody.innerHTML = "";
      const t = i18n[idiomaAtual];

      ["cidade", "salario", "custoFixo", "sobra", "margem", "mesesIphone", "mesesCarro", "ivfr"].forEach(col => {
        const el = document.getElementById("sort_" + col);
        if (el) {
          el.innerText = (colunaOrdenada === col) ? (ordemAscendente ? "▲" : "▼") : "↕";
          el.style.color = (colunaOrdenada === col) ? "var(--score-high)" : "var(--subtext)";
        }
      });

      let dadosProcessados = baseDados.map((item, originalIndex) => ({
        ...calcularValoresCompletos(normalizarItem(item)),
        originalIndex
      }));

      dadosProcessados.sort((a, b) => {
        let vA = a[colunaOrdenada];
        let vB = b[colunaOrdenada];

        if (typeof vA === "string") {
          return ordemAscendente ? vA.localeCompare(vB) : vB.localeCompare(vA);
        }
        return ordemAscendente ? (vA - vB) : (vB - vA);
      });

      dadosProcessados.forEach(item => {
        const m = item.moeda ? item.moeda + " " : "";
        tbody.insertAdjacentHTML("beforeend", `
          <tr>
            <td><span class="flag">${item.bandeira || "🌐"}</span><strong>${item.cidade}</strong></td>
            <td>${m}${item.salario.toLocaleString()}</td>
            <td>${m}${item.custoFixo.toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
            <td class="${item.classe}"><strong>${m}${item.sobra.toLocaleString(undefined, {maximumFractionDigits: 0})}</strong></td>
            <td>${item.margemStr}</td>
            <td>${item.mesesIphoneStr}</td>
            <td>${item.mesesCarroStr}</td>
            <td><span class="score ${item.classe}">${item.ivfr.toFixed(1)}</span> / 100</td>
            <td>
              <button class="btn-action" onclick="carregarParaEdicao(${item.originalIndex})" data-tip="${t.tipEdit}">✏️</button>
              <button class="btn-action btn-delete" onclick="removerPais(${item.originalIndex})" data-tip="${t.tipDelete}">✕</button>
            </td>
          </tr>
        `);
      });
    }

    function formatarDataHora(data) {
      const m = data.getMonth() + 1;
      const d = data.getDate();
      const y = data.getFullYear();
      let hours = data.getHours();
      const minutes = String(data.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12;
      hours = hours ? hours : 12;
      const strHours = String(hours).padStart(2, '0');
      return `${m}/${d}/${y} ${strHours}:${minutes} ${ampm}`;
    }

    async function carregarDoGitHub(forcar = false) {
      try {
        const res = await fetch(`https://api.github.com/repos/${USUARIO}/${REPO}/contents/${ARQUIVO}?nocache=${Date.now()}`);
        const data = await res.json();
        fileSha = data.sha;
        const jsonText = decodeURIComponent(escape(atob(data.content)));
        baseDados = JSON.parse(jsonText).map(normalizarItem);
        
        document.getElementById("txtLastUpdate").innerText = i18n[idiomaAtual].lastSync + formatarDataHora(new Date());
        renderizarTabela();
      } catch (err) {
        console.warn("Aguardando carregamento de base do GitHub.");
      }
    }

    async function gravarNoGitHub() {
      const token = localStorage.getItem("gh_pat");
      const msg = document.getElementById("statusMsg");
      const t = i18n[idiomaAtual];
      
      if (!token) {
        alert(t.tokenLabel);
        return;
      }

      msg.style.display = "inline";
      msg.style.color = "var(--score-mid)";
      msg.innerText = t.msgSaving;

      const conteudoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(baseDados, null, 2))));

      try {
        const res = await fetch(`https://api.github.com/repos/${USUARIO}/${REPO}/contents/${ARQUIVO}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Atualização de cidades via dashboard",
            content: conteudoBase64,
            sha: fileSha
          })
        });

        if (res.ok) {
          const result = await res.json();
          fileSha = result.content.sha;
          msg.style.color = "var(--score-high)";
          msg.innerText = t.msgSaved;
          carregarDoGitHub();
        } else {
          msg.style.color = "var(--score-low)";
          msg.innerText = t.msgError;
        }
      } catch (e) {
        msg.style.color = "var(--score-low)";
        msg.innerText = t.msgError;
      }

      setTimeout(() => { msg.style.display = "none"; }, 4000);
    }

    function salvarPais() {
      const index = parseInt(document.getElementById("editIndex").value);
      const dados = {
        bandeira: document.getElementById("bandeira").value || "🌐",
        cidade: document.getElementById("cidade").value,
        moeda: document.getElementById("moeda").value || "$",
        salario: parseFloat(document.getElementById("salario").value) || 0,
        aluguel: parseFloat(document.getElementById("aluguel").value) || 0,
        alimentacao: parseFloat(document.getElementById("alimentacao").value) || 0,
        internet: parseFloat(document.getElementById("internet").value) || 0,
        academia: parseFloat(document.getElementById("academia").value) || 0,
        extras: parseFloat(document.getElementById("extras").value) || 0,
        parcela: parseFloat(document.getElementById("parcela").value) || 0,
        iphone: parseFloat(document.getElementById("iphone").value) || 0,
        entrada: parseFloat(document.getElementById("entrada").value) || 0
      };

      if (index >= 0) baseDados[index] = dados;
      else baseDados.push(dados);

      cancelarEdicao();
      renderizarTabela();
      gravarNoGitHub();
    }

    function removerPais(index) {
      const t = i18n[idiomaAtual];
      if (confirm(`${t.confirmDelete}${baseDados[index].cidade}?`)) {
        baseDados.splice(index, 1);
        renderizarTabela();
        gravarNoGitHub();
      }
    }

    function carregarParaEdicao(index) {
      const item = baseDados[index];
      const t = i18n[idiomaAtual];
      document.getElementById("editIndex").value = index;
      document.getElementById("bandeira").value = item.bandeira || "🌐";
      document.getElementById("cidade").value = item.cidade;
      document.getElementById("moeda").value = item.moeda || "$";
      document.getElementById("salario").value = item.salario;
      document.getElementById("aluguel").value = item.aluguel;
      document.getElementById("alimentacao").value = item.alimentacao;
      document.getElementById("internet").value = item.internet || 0;
      document.getElementById("academia").value = item.academia || 0;
      document.getElementById("extras").value = item.extras || 0;
      document.getElementById("parcela").value = item.parcela;
      document.getElementById("iphone").value = item.iphone;
      document.getElementById("entrada").value = item.entrada;

      document.getElementById("btnSubmit").innerText = t.btnSubmitUpdate;
      document.getElementById("btnCancel").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicao() {
      const t = i18n[idiomaAtual];
      document.getElementById("editIndex").value = "-1";
      document.getElementById("btnSubmit").innerText = t.btnSubmitAdd;
      document.getElementById("btnCancel").style.display = "none";
    }

    function salvarToken() {
      const t = document.getElementById("ghToken").value.trim();
      if (t) {
        localStorage.setItem("gh_pat", t);
        document.getElementById("tokenModal").style.display = "none";
        carregarDoGitHub();
      }
    }

    const tipBox = document.getElementById("globalTooltip");
    document.addEventListener("mouseover", (e) => {
      const target = e.target.closest("[data-tip]");
      if (target) {
        const text = target.getAttribute("data-tip");
        if (text) {
          tipBox.innerText = text;
          tipBox.style.display = "block";
          const rect = target.getBoundingClientRect();
          tipBox.style.top = Math.max(10, rect.top - tipBox.offsetHeight - 8) + "px";
          tipBox.style.left = Math.min(window.innerWidth - 290, Math.max(10, rect.left + (rect.width/2) - (tipBox.offsetWidth/2))) + "px";
        }
      }
    });

    document.addEventListener("mouseout", (e) => {
      if (e.target.closest("[data-tip]")) {
        tipBox.style.display = "none";
      }
    });

    const tokenSalvo = localStorage.getItem("gh_pat");
    if (tokenSalvo) document.getElementById("ghToken").value = tokenSalvo;
    atualizarBotaoTema();
    mudarIdioma(idiomaAtual);
    carregarDoGitHub();
  </script>
</body>
</html>
