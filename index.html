<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custo de Vida Global</title>
    <style>
        body { font-family: monospace, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 0; }
        header { background: #1e1e1e; padding: 1rem; border-bottom: 1px solid #333; display: flex; justify-content: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.5);}
        .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;}
        .controls button { background: #2c2c2c; color: #fff; border: 1px solid #444; padding: 0.5rem 1rem; cursor: pointer; border-radius: 4px; transition: 0.2s; font-family: monospace;}
        .controls button:hover { background: #3d3d3d; }
        .controls button.active { background: #f39c12; color: #000; font-weight: bold; border-color: #f39c12;}
        .settings-btn { border-color: #f39c12 !important; color: #f39c12 !important; background: transparent !important;}
        .settings-btn:hover { background: #f39c12 !important; color: #000 !important; }
        main { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1rem; padding: 1rem; max-width: 1400px; margin: 0 auto;}
        .card { background: #1e1e1e; border: 1px solid #333; border-radius: 6px; padding: 1.25rem; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: transform 0.2s;}
        .card:hover { transform: translateY(-2px); border-color: #555;}
        .card h3 { margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 0.5rem; font-size: 1.2rem; color: #f39c12;}
        .metric { display: flex; justify-content: space-between; margin-bottom: 0.4rem; font-size: 0.95rem; }
        .metric span:first-child { color: #aaa; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 1000;}
        .hidden { display: none !important; }
        .modal-content { background: #1e1e1e; padding: 2rem; border-radius: 6px; border: 1px solid #444; width: 90%; max-width: 400px; max-height: 80vh; overflow-y: auto; }
        .modal-content h2 { margin-top: 0; color: #f39c12; font-size: 1.2rem; border-bottom: 1px solid #333; padding-bottom: 0.5rem;}
        .rate-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .rate-row label { color: #ccc; font-size: 0.9rem;}
        .rate-row input { background: #121212; border: 1px solid #444; color: #fff; text-align: right; padding: 0.3rem; border-radius: 4px; width: 100px; font-family: monospace;}
        .close { float: right; cursor: pointer; font-size: 1.5rem; font-weight: bold; color: #888; transition: 0.2s;}
        .close:hover { color: #fff; }
        .modal-content button { background: #f39c12; color: #000; font-weight: bold; border: none; padding: 0.75rem; cursor: pointer; width: 100%; margin-top: 1.5rem; border-radius: 4px; font-family: monospace; font-size: 1rem;}
        .modal-content button:hover { background: #e67e22; }
    </style>
</head>
<body>
    <header>
        <div class="controls">
            <button id="btn-USD" onclick="setDisplayMode('USD')">Dólar (USD)</button>
            <button id="btn-EUR" onclick="setDisplayMode('EUR')">Euro (EUR)</button>
            <button id="btn-ORIGINAL" onclick="setDisplayMode('ORIGINAL')">Moeda Local</button>
            <button onclick="toggleSettings()" class="settings-btn">⚙️ Ajustar Câmbio</button>
        </div>
    </header>

    <div id="settings-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close" onclick="toggleSettings()">&times;</span>
            <h2>Taxas de Câmbio (Base: 1 USD)</h2>
            <div id="rates-container"></div>
            <button onclick="saveRates()">Salvar e Aplicar</button>
        </div>
    </div>

    <main id="cards-container"></main>

    <script>
        const currencyMap = {
          "Qatar": "QAR", "Spain": "EUR", "Murcia": "EUR", "United States": "USD", "Des Moines": "USD", "Newport Beach": "USD", "Washington, D.C.": "USD", "United Arab Emirates": "AED", "Taiwan": "TWD", "Oman": "OMR", "Armenia": "AMD", "Japan": "JPY", "Singapore": "SGD", "Thailand": "THB", "Bahrain": "BHD", "Slovenia": "EUR", "Ljubljana": "EUR", "Saudi Arabia": "SAR", "Estonia": "EUR", "Tallinn": "EUR", "Switzerland": "CHF", "South Korea": "KRW", "Chile": "CLP", "Croatia": "EUR", "Zagreb": "EUR", "Netherlands": "EUR", "Amsterdam": "EUR", "Denmark": "DKK", "Finland": "EUR", "Helsinki": "EUR", "Sweden": "SEK", "Czechia": "CZK", "Austria": "EUR", "Vienna": "EUR", "Poland": "PLN", "Portugal": "EUR", "Lisbon": "EUR", "Uzbekistan": "UZS", "Slovakia": "EUR", "Bratislava": "EUR", "Azerbaijan": "AZN", "Israel": "ILS", "Cuba": "CUP", "Norway": "NOK", "Cyprus": "EUR", "Nicosia": "EUR", "Kuwait": "KWD", "Romania": "RON", "Lithuania": "EUR", "Vilnius": "EUR", "Hungary": "HUF", "Luxembourg": "EUR", "Canada": "CAD", "Montenegro": "EUR", "Podgorica": "EUR", "Latvia": "EUR", "Riga": "EUR", "Nepal": "NPR", "Bulgaria": "BGN", "Georgia": "GEL", "Germany": "EUR", "Berlin": "EUR", "Serbia": "RSD", "Kosovo": "EUR", "Pristina": "EUR", "Russia": "RUB", "Malta": "EUR", "Valletta": "EUR", "Türkiye": "TRY", "Jordan": "JOD", "North Macedonia": "MKD", "Moldova": "MDL", "Sri Lanka": "LKR", "Bosnia & Herzegovina": "BAM", "Philippines": "PHP", "Pakistan": "PKR", "Vietnam": "VND", "Panama": "PAB", "India": "INR", "Tunisia": "TND", "Albania": "ALL", "Indonesia": "IDR", "Iraq": "IQD", "Ireland": "EUR", "Dublin": "EUR", "Kazakhstan": "KZT", "Lebanon": "LBP", "Greece": "EUR", "Athens": "EUR", "Australia": "AUD", "Ukraine": "UAH", "United Kingdom": "GBP", "Egypt": "EGP", "New Zealand": "NZD", "Morocco": "MAD", "Italy": "EUR", "Rome": "EUR", "Mauritius": "MUR", "Belgium": "EUR", "Brussels": "EUR", "Iran": "IRR", "Belarus": "BYN", "Algeria": "DZD", "Malaysia": "MYR", "Uruguay": "UYU", "Costa Rica": "CRC", "Mexico": "MXN", "Dominican Republic": "DOP", "France": "EUR", "Paris": "EUR", "Kenya": "KES", "Zimbabwe": "ZWG", "Ecuador": "USD", "China": "CNY", "Colombia": "COP", "Puerto Rico": "USD", "Bolivia": "BOB", "Bangladesh": "BDT", "Argentina": "ARS", "Nigeria": "NGN", "Indaiatuba": "BRL", "Brazil": "BRL", "Peru": "PEN", "South Africa": "ZAR", "Venezuela": "VES"
        };

        let userExchangeRates = {
            "USD": 1.0, "EUR": 0.92, "QAR": 3.64, "AED": 3.67, "TWD": 31.5, "OMR": 0.38, "AMD": 395.0,
            "JPY": 150.0, "SGD": 1.34, "THB": 36.0, "BHD": 0.38, "SAR": 3.75, "CHF": 0.88, "KRW": 1330.0,
            "CLP": 950.0, "DKK": 6.85, "SEK": 10.4, "CZK": 23.3, "PLN": 3.95, "UZS": 12500.0, "AZN": 1.7,
            "ILS": 3.6, "CUP": 24.0, "NOK": 10.5, "KWD": 0.31, "RON": 4.6, "HUF": 360.0, "CAD": 1.35,
            "NPR": 133.0, "BGN": 1.8, "GEL": 2.65, "RSD": 108.0, "RUB": 90.0, "TRY": 31.0, "JOD": 0.71,
            "MKD": 56.5, "MDL": 17.8, "LKR": 305.0, "BAM": 1.8, "PHP": 56.0, "PKR": 278.0, "VND": 24500.0,
            "PAB": 1.0, "INR": 83.0, "TND": 3.1, "ALL": 95.0, "IDR": 15600.0, "IQD": 1310.0, "KZT": 450.0,
            "LBP": 89500.0, "AUD": 1.5, "UAH": 38.0, "GBP": 0.79, "EGP": 31.0, "NZD": 1.6, "MAD": 10.0,
            "MUR": 46.0, "IRR": 42000.0, "BYN": 3.2, "DZD": 134.0, "MYR": 4.7, "UYU": 39.0, "CRC": 515.0,
            "MXN": 17.0, "DOP": 58.0, "KES": 145.0, "ZWG": 13.5, "CNY": 7.2, "COP": 3900.0, "BOB": 6.9,
            "BDT": 110.0, "ARS": 850.0, "NGN": 1500.0, "BRL": 5.15, "PEN": 3.8, "ZAR": 19.0, "VES": 36.0
        };

        let currentDisplayMode = 'USD';
        let rawData = [];

        function convertValue(baseValueUSD, location, mode) {
            if (mode === 'USD') return baseValueUSD;
            if (mode === 'EUR') return baseValueUSD * userExchangeRates['EUR'];
            const localCurrency = currencyMap[location] || 'USD';
            const rate = userExchangeRates[localCurrency] || 1;
            return baseValueUSD * rate;
        }

        function getSymbol(location, mode) {
            if (mode === 'USD') return '$';
            if (mode === 'EUR') return '€';
            return (currencyMap[location] || 'USD') + ' ';
        }

        function formatCurrency(value) {
            return new Intl.NumberFormat('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(value);
        }

        function renderCards() {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';
            
            rawData.forEach(item => {
                const loc = item.paisNome || item.cidade;
                const sym = getSymbol(loc, currentDisplayMode);
                
                const metrics = ['salario', 'aluguel', 'alimentacao', 'internet', 'academia', 'extras', 'parcela', 'iphone', 'entrada'];
                
                let cardHTML = `<div class="card">
                    <h3>${item.bandeira} ${item.cidade} ${item.paisNome ? '(' + item.paisNome + ')' : ''}</h3>`;
                    
                metrics.forEach(m => {
                    if(item[m] !== undefined) {
                        const val = convertValue(item[m], loc, currentDisplayMode);
                        const label = m.charAt(0).toUpperCase() + m.slice(1);
                        cardHTML += `<div class="metric"><span>${label}:</span> <span>${sym}${formatCurrency(val)}</span></div>`;
                    }
                });
                
                cardHTML += `</div>`;
                container.innerHTML += cardHTML;
            });
        }

        function setDisplayMode(mode) {
            currentDisplayMode = mode;
            document.querySelectorAll('.controls button:not(.settings-btn)').forEach(b => b.classList.remove('active'));
            document.getElementById(`btn-${mode}`).classList.add('active');
            renderCards();
        }

        function toggleSettings() {
            const modal = document.getElementById('settings-modal');
            if(modal.classList.contains('hidden')) {
                renderSettings();
                modal.classList.remove('hidden');
            } else {
                modal.classList.add('hidden');
            }
        }

        function renderSettings() {
            const container = document.getElementById('rates-container');
            container.innerHTML = '';
            Object.keys(userExchangeRates).sort().forEach(currency => {
                if(currency === 'USD') return;
                container.innerHTML += `
                    <div class="rate-row">
                        <label>1 USD = ${currency}</label>
                        <input type="number" step="0.01" id="rate-${currency}" value="${userExchangeRates[currency]}">
                    </div>
                `;
            });
        }

        function saveRates() {
            Object.keys(userExchangeRates).forEach(currency => {
                if(currency === 'USD') return;
                const input = document.getElementById(`rate-${currency}`);
                if(input) {
                    userExchangeRates[currency] = parseFloat(input.value) || userExchangeRates[currency];
                }
            });
            toggleSettings();
            renderCards();
        }

        // Faz o fetch do dados.json ao carregar a página
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                const response = await fetch('dados.json');
                if (!response.ok) throw new Error("Erro na rede");
                rawData = await response.json();
                setDisplayMode('USD');
            } catch (error) {
                console.error("Erro ao carregar dados.json:", error);
                document.getElementById('cards-container').innerHTML = 
                    "<p style='text-align:center;'>Erro ao carregar os dados. Se estiver abrindo o arquivo localmente, suba-o para o GitHub ou use um servidor local.</p>";
            }
        });
    </script>
</body>
</html>
