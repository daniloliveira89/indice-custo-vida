<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Índice de Viabilidade Econômica (IVFR)</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; margin: 0; }
    .container { max-width: 1250px; margin: 0 auto; }
    
    .header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
    h1 { font-size: 1.6rem; margin: 0 0 0.3rem 0; }
    p.sub { color: #94a3b8; font-size: 0.85rem; margin: 0; }
    
    .top-actions { display: flex; gap: 0.5rem; align-items: center; }
    select.lang-select { background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 0.4rem 0.6rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-settings { background: #1e293b; border: 1px solid #334155; color: #94a3b8; padding: 0.4rem 0.7rem; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-settings:hover { color: #fff; background: #334155; }

    .token-modal { display: none; background: #020617; border: 1px solid #334155; padding: 1rem; border-radius: 8px; margin-bottom: 1.2rem; }
    .token-row { display: flex; gap: 0.5rem; margin-top: 0.5rem; }

    .card { background: #1e293b; padding: 1.2rem; border-radius: 8px; margin-bottom: 1.5rem; border: 1px solid #334155; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(115px, 1fr)); gap: 0.8rem; }
    label { display: block; font-size: 0.75rem; color: #94a3b8; margin-bottom: 0.2rem; }
    input { width: 100%; padding: 0.45rem; background: #334155; border: 1px solid #475569; color: #fff; border-radius: 4px; box-sizing: border-box; font-size: 0.85rem; }
    
    .btn-group { display: flex; gap: 0.5rem; margin-top: 1rem; align-items: center; }
    button.btn-main { background: #2563eb; color: #fff; border: none; padding: 0.45rem 0.85rem; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    button.btn-main:hover { background: #1d4ed8; }
    button.btn-sec { background: #059669; color: #fff; border: none; padding: 0.45rem 0.8rem; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
    button.btn-sec:hover { background: #047857; }
    button.btn-cancel { background: #991b1b; color: #fff; border: none; padding: 0.45rem 0.85rem; border-radius: 4px; cursor: pointer; font-size: 0.85rem; display: none; }

    table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; border: 1px solid #334155; }
    th, td { padding: 0.75rem 0.8rem; text-align: left; border-bottom: 1px solid #334155; font-size: 0.85rem; }
    th { background: #020617; color: #94a3b8; user-select: none; cursor: pointer; }
    th:hover { color: #f8fafc; background: #0f172a; }
    th.no-sort { cursor: default; }
    th.no-sort:hover { background: #020617; color: #94a3b8; }
    
    .flag { font-size: 1.2rem; margin-right: 0.35rem; vertical-align: middle; }
    .score { font-size: 0.95rem; font-weight: bold; }
    .score-high { color: #4ade80; } /* Verde >= 5.0 */
    .score-mid { color: #facc15; }  /* Amarelo 2.0 - 4.9 */
    .score-low { color: #f87171; }  /* Vermelho < 2.0 */
    
    .btn-action { background: #334155; color: #94a3b8; border: none; padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; margin-right: 0.2rem; }
    .btn-action:hover { background: #475569; color: #fff; }
    .btn-delete:hover { background: #ef4444; color: #fff; }

    .status-msg { font-size: 0.85rem; color: #4ade80; display: none; }

    /* Tooltip flutuante global */
    .has-tooltip { border-bottom: 1px dotted #64748b; cursor: help; display: inline-block; }
    #globalTooltip {
      position: fixed;
      display: none;
      background: #020617;
      color: #f8fafc;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-size: 0.75rem;
      border: 1px solid #475569;
      line-height: 1.35;
      z-index: 999999;
      max-width: 270px;
      pointer-events: none;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1 id="txtTitle">Índice de Viabilidade Econômica (IVFR)</h1>
        <p class="sub" id="txtSubtitle">Poder de compra real e velocidade de aquisição de bens por cidade.</p>
      </div>
      <div class="top-actions">
        <select id="langSelector" class="lang-select" onchange="mudarIdioma(this.value)">
          <option value="pt">🇧🇷 Português</option>
          <option value="en">🇺🇸 English</option>
          <option value="es">🇪🇸 Español</option>
        </select>
        <button class="btn-settings" onclick="toggleSettings()">⚙️ <span id="txtBtnSettings">GitHub</span></button>
      </div>
    </div>

    <div id="tokenModal" class="token-modal">
      <label id="txtTokenLabel" style="font-size:0.8rem; color:#cbd5e1;">GitHub Personal Access Token (PAT):</label>
      <div class="token-row">
        <input id="ghToken" type="password" placeholder="github_pat_..." style="flex:1;">
        <button class="btn-sec" onclick="salvarToken()" id="txtBtnSaveToken">Salvar Token</button>
      </div>
    </div>
    
    <div class="card">
      <input type="hidden" id="editIndex" value="-1">
      <div class="grid">
        <div style="max-width:65px"><label id="lblFlag">Bandeira</label><input id="bandeira" value="🌐" maxlength="4"></div>
        <div><label id="lblCity">Cidade</label><input id="cidade" value="Nova Cidade"></div>
        <div style="max-width:65px"><label id="lblCurrency">Moeda</label><input id="moeda" value="$" maxlength="5"></div>
        <div><label id="lblSalary">Salário Líq.</label><input id="salario" type="number" value="3000"></div>
        <div><label id="lblRent">Aluguel (1Q)</label><input id="aluguel" type="number" value="1000"></div>
        <div><label id="lblFood">Alimentação</label><input id="alimentacao" type="number" value="400"></div>
        <div><label><span class="has-tooltip" id="lblCarInstallment" data-tip="">Parcela Carro</span></label><input id="parcela" type="number" value="300"></div>
        <div><label><span class="has-tooltip" id="lblIphone" data-tip="">iPhone Atual</span></label><input id="iphone" type="number" value="1000"></div>
        <div><label><span class="has-tooltip" id="lblCarDown" data-tip="">Entrada Carro</span></label><input id="entrada" type="number" value="4000"></div>
      </div>
      <div class="btn-group">
        <button id="btnSubmit" class="btn-main has-tooltip" onclick="salvarPais()" data-tip="">Salvar</button>
        <button id="btnCancel" class="btn-cancel" onclick="cancelarEdicao()">Cancelar</button>
        <span id="statusMsg" class="status-msg">Gravando...</span>
      </div>
    </div>

    <table id="tabela">
      <thead>
        <tr>
          <th onclick="ordenarColuna('cidade')"><span id="thCity">Cidade</span> <span id="sort_cidade">↕</span></th>
          <th onclick="ordenarColuna('salario')"><span id="thSalary">Salário Líq.</span> <span id="sort_salario">↕</span></th>
          <th onclick="ordenarColuna('custoFixo')"><span class="has-tooltip" id="thFixed" data-tip="">Custo Fixo</span> <span id="sort_custoFixo">↕</span></th>
          <th onclick="ordenarColuna('sobra')"><span id="thSurplus">Sobra Líquida</span> <span id="sort_sobra">↕</span></th>
          <th onclick="ordenarColuna('margem')"><span id="thMargin">Margem Livre</span> <span id="sort_margem">↕</span></th>
          <th onclick="ordenarColuna('mesesIphone')"><span class="has-tooltip" id="thMonthsIphone" data-tip="">Meses p/ iPhone</span> <span id="sort_mesesIphone">↕</span></th>
          <th onclick="ordenarColuna('mesesCarro')"><span class="has-tooltip" id="thMonthsCar" data-tip="">Meses Entrada Carro</span> <span id="sort_mesesCarro">↕</span></th>
          <th onclick="ordenarColuna('ivfr')"><span class="has-tooltip" id="thIvfr" data-tip="">Fator IVFR (0-100)</span> <span id="sort_ivfr">↕</span></th>
          <th class="no-sort" id="thActions">Ações</th>
        </tr>
      </thead>
      <tbody id="tabelaCorpo"></tbody>
    </table>
  </div>

  <div id="globalTooltip"></div>

  <script>
    const USUARIO = "daniloliveira89";
    const REPO = "indice-custo-vida";
    const ARQUIVO = "dados.json";

    const i18n = {

      },
      en: {

        btnSettings: "GitHub",

        btnSaveToken: "Save Token",

      },
      es: {
        title: "Índice de Viabilidad Económica (IVFR)",
        subtitle: "Poder adquisitivo real y velocidad de adquisición de bienes por ciudad.",
        btnSettings: "GitHub",
        tokenLabel: "GitHub Personal Access Token (PAT):",
        btnSaveToken: "Guardar Token",

        lblCity: "Ciudad",
        lblCurrency: "Moneda",
        lblSalary: "Salario Neto",
        lblRent: "Alquiler (1D)",
        lblFood: "Alimentación",
        lblCarInstallment: "Cuota Coche",
        lblCarInstallmentTooltip: "Cuota mensual promedio de financiación de coche estándar (ej: VW Golf / Toyota Corolla).",

        btnSubmitAdd: "Guardar",
        btnSubmitUpdate: "Actualizar",
        btnSubmitTooltip: "Guarda y hace commit directamente en el archivo dados.json de tu repositorio GitHub.",
        btnCancel: "Cancelar",

        thSalary: "Salario Neto",
        thFixed: "Coste Fijo",
        thFixedTooltip: "Alquiler + Alimentación + Cuota del Coche.",
        thSurplus: "Sobrante Neto",
        thMargin: "Margen Libre",
        thMonthsIphone: "Meses para iPhone",
        thMonthsIphoneTooltip: "Meses de ahorro neto necesarios para comprar el último iPhone al contado.",
        thMonthsCar: "Meses Entrada Coche",
        thMonthsCarTooltip: "Meses de ahorro neto necesarios para pagar la entrada del 20% del coche.",
        thIvfr: "Factor IVFR (0-100)",
        thIvfrTooltip: "Índice sintético que equilibra el margen libre y la velocidad para el iPhone y la entrada del coche. Puntuaciones 5.0+ se destacan en verde.",
        thActions: "Acciones",
        btnEdit: "Editar",
        btnDelete: "✕",
        msgInfeasible: "Inviable",
        msgSaving: "Guardando en GitHub...",
        msgSaved: "✔️ ¡Guardado en GitHub!",
        msgError: "Error al guardar. Revise el token.",
        confirmDelete: "¿Eliminar "

    };

    let idiomaAtual = localStorage.getItem("ivfr_lang") || "pt";
    let baseDados = [];
    let fileSha = "";
    let colunaOrdenada = "ivfr";
    let ordemAscendente = false;

    function normalizarItem(item) {
      let cidadeNome = item.cidade || item.pais || "Cidade";
      cidadeNome = cidadeNome.replace(/EUA\s*\(|\)|Brasil\s*\(|Espanha\s*\(|Alemanha\s*\(/g, '').trim();
      let moeda = item.moeda || "$";
      if (!item.moeda) {
        if (cidadeNome.includes("São Paulo") || cidadeNome.includes("Brasil")) moeda = "R$";
        else if (cidadeNome.includes("Madri") || cidadeNome.includes("Berlim")) moeda = "€";
      }
      return {
        ...item,
        cidade: cidadeNome,
        moeda: moeda,
        iphone: item.iphone || item.eletronico || 1000,
        entrada: item.entrada || 4000
      };
    }

    function mudarIdioma(lang) {
      idiomaAtual = lang;
      localStorage.setItem("ivfr_lang", lang);
      document.getElementById("langSelector").value = lang;
      const t = i18n[lang];

      document.getElementById("txtTitle").innerText = t.title;
      document.getElementById("txtSubtitle").innerText = t.subtitle;
      document.getElementById("txtBtnSettings").innerText = t.btnSettings;
      document.getElementById("txtTokenLabel").innerText = t.tokenLabel;
      document.getElementById("txtBtnSaveToken").innerText = t.btnSaveToken;
      document.getElementById("lblFlag").innerText = t.lblFlag;
      document.getElementById("lblCity").innerText = t.lblCity;
      document.getElementById("lblCurrency").innerText = t.lblCurrency;
      document.getElementById("lblSalary").innerText = t.lblSalary;
      document.getElementById("lblRent").innerText = t.lblRent;
      document.getElementById("lblFood").innerText = t.lblFood;
      
      document.getElementById("lblCarInstallment").innerText = t.lblCarInstallment;
      document.getElementById("lblCarInstallment").setAttribute("data-tip", t.lblCarInstallmentTooltip);
      document.getElementById("lblIphone").innerText = t.lblIphone;
      document.getElementById("lblIphone").setAttribute("data-tip", t.lblIphoneTooltip);
      document.getElementById("lblCarDown").innerText = t.lblCarDown;
      document.getElementById("lblCarDown").setAttribute("data-tip", t.lblCarDownTooltip);

      const btnSubmit = document.getElementById("btnSubmit");
      btnSubmit.innerText = document.getElementById("editIndex").value === "-1" ? t.btnSubmitAdd : t.btnSubmitUpdate;
      btnSubmit.setAttribute("data-tip", t.btnSubmitTooltip);
      document.getElementById("btnCancel").innerText = t.btnCancel;
      
      document.getElementById("thCity").innerText = t.thCity;
      document.getElementById("thSalary").innerText = t.thSalary;
      document.getElementById("thFixed").innerText = t.thFixed;
      document.getElementById("thFixed").setAttribute("data-tip", t.thFixedTooltip);
      document.getElementById("thSurplus").innerText = t.thSurplus;
      document.getElementById("thMargin").innerText = t.thMargin;
      document.getElementById("thMonthsIphone").innerText = t.thMonthsIphone;
      document.getElementById("thMonthsIphone").setAttribute("data-tip", t.thMonthsIphoneTooltip);
      document.getElementById("thMonthsCar").innerText = t.thMonthsCar;
      document.getElementById("thMonthsCar").setAttribute("data-tip", t.thMonthsCarTooltip);
      document.getElementById("thIvfr").innerText = t.thIvfr;
      document.getElementById("thIvfr").setAttribute("data-tip", t.thIvfrTooltip);
      document.getElementById("thActions").innerText = t.thActions;

      renderizarTabela();
    }

    function toggleSettings() {
      const modal = document.getElementById("tokenModal");
      modal.style.display = modal.style.display === "block" ? "none" : "block";
    }

    function calcularValoresCompletos(item) {
      const custoFixo = (item.aluguel || 0) + (item.alimentacao || 0) + (item.parcela || 0);
      const sobra = (item.salario || 0) - custoFixo;
      const t = i18n[idiomaAtual];

      if (sobra <= 0) {
        return {
          ...item,
          custoFixo,
          sobra,
          margem: 0,
          margemStr: "0.0%",
          mesesIphone: 999,
          mesesIphoneStr: t.msgInfeasible,
          mesesCarro: 999,
          mesesCarroStr: t.msgInfeasible,
          ivfr: 0.0,
          classe: "score-low"
        };
      }

      const margem = sobra / item.salario;
      const precoIphone = item.iphone || 1000;
      const precoEntrada = item.entrada || 4000;
      
      const mesesIphone = precoIphone / sobra;
      const mesesCarro = precoEntrada / sobra;
      const tempoTotalBens = (precoIphone + precoEntrada) / sobra;
      
      const penalidadeTempo = 1 / (1 + Math.log(1 + tempoTotalBens));
      const ivfr = Math.min(100, Math.max(0, margem * 100 * penalidadeTempo * 1.5));

      let classe = "score-low";
      if (ivfr >= 5.0) classe = "score-high";
      else if (ivfr >= 2.0) classe = "score-mid";

      return {
        ...item,
        custoFixo,
        sobra,
        margem,
        margemStr: (margem * 100).toFixed(1) + "%",
        mesesIphone,
        mesesIphoneStr: mesesIphone.toFixed(1) + " m",
        mesesCarro,
        mesesCarroStr: mesesCarro.toFixed(1) + " m",
        ivfr: parseFloat(ivfr.toFixed(1)),
        classe
      };
    }

    function ordenarColuna(campo) {
      if (colunaOrdenada === campo) {
        ordemAscendente = !ordemAscendente;
      } else {
        colunaOrdenada = campo;
        ordemAscendente = campo === "cidade" ? true : false;
      }
      renderizarTabela();
    }

    function renderizarTabela() {
      const tbody = document.getElementById("tabelaCorpo");
      tbody.innerHTML = "";
      const t = i18n[idiomaAtual];

      ["cidade", "salario", "custoFixo", "sobra", "margem", "mesesIphone", "mesesCarro", "ivfr"].forEach(col => {
        const el = document.getElementById("sort_" + col);
        if (el) {
          el.innerText = (colunaOrdenada === col) ? (ordemAscendente ? "▲" : "▼") : "↕";
          el.style.color = (colunaOrdenada === col) ? "#4ade80" : "#64748b";
        }
      });

      let dadosProcessados = baseDados.map((item, originalIndex) => ({
        ...calcularValoresCompletos(normalizarItem(item)),
        originalIndex
      }));

      dadosProcessados.sort((a, b) => {
        let vA = a[colunaOrdenada];
        let vB = b[colunaOrdenada];

        if (typeof vA === "string") {
          return ordemAscendente ? vA.localeCompare(vB) : vB.localeCompare(a[colunaOrdenada]);
        }
        return ordemAscendente ? (vA - vB) : (vB - vA);
      });

      dadosProcessados.forEach(item => {
        const m = item.moeda ? item.moeda + " " : "";
        tbody.insertAdjacentHTML("beforeend", `
          <tr>
            <td><span class="flag">${item.bandeira || "🌐"}</span><strong>${item.cidade}</strong></td>
            <td>${m}${item.salario.toLocaleString()}</td>
            <td>${m}${item.custoFixo.toLocaleString(undefined, {maximumFractionDigits: 0})}</td>
            <td class="${item.classe}"><strong>${m}${item.sobra.toLocaleString(undefined, {maximumFractionDigits: 0})}</strong></td>
            <td>${item.margemStr}</td>
            <td>${item.mesesIphoneStr}</td>
            <td>${item.mesesCarroStr}</td>
            <td><span class="score ${item.classe}">${item.ivfr.toFixed(1)}</span> / 100</td>
            <td>
              <button class="btn-action" onclick="carregarParaEdicao(${item.originalIndex})">${t.btnEdit}</button>
              <button class="btn-action btn-delete" onclick="removerPais(${item.originalIndex})">${t.btnDelete}</button>
            </td>
          </tr>
        `);
      });
    }

    async function carregarDoGitHub() {
      try {
        const res = await fetch(`https://api.github.com/repos/${USUARIO}/${REPO}/contents/${ARQUIVO}?t=${Date.now()}`);
        const data = await res.json();
        fileSha = data.sha;
        const jsonText = decodeURIComponent(escape(atob(data.content)));
        baseDados = JSON.parse(jsonText).map(normalizarItem);
        renderizarTabela();
      } catch (err) {
        console.warn("Aguardando carregamento de base do GitHub.");
      }
    }

    async function gravarNoGitHub() {
      const token = localStorage.getItem("gh_pat");
      const msg = document.getElementById("statusMsg");
      const t = i18n[idiomaAtual];
      
      if (!token) {
        alert(t.tokenLabel);
        return;
      }

      msg.style.display = "inline";
      msg.style.color = "#facc15";
      msg.innerText = t.msgSaving;

      const conteudoBase64 = btoa(unescape(encodeURIComponent(JSON.stringify(baseDados, null, 2))));

      try {
        const res = await fetch(`https://api.github.com/repos/${USUARIO}/${REPO}/contents/${ARQUIVO}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: "Atualização de cidades via dashboard",
            content: conteudoBase64,
            sha: fileSha
          })
        });

        if (res.ok) {
          const result = await res.json();
          fileSha = result.content.sha;
          msg.style.color = "#4ade80";
          msg.innerText = t.msgSaved;
        } else {
          msg.style.color = "#f87171";
          msg.innerText = t.msgError;
        }
      } catch (e) {
        msg.style.color = "#f87171";
        msg.innerText = t.msgError;
      }

      setTimeout(() => { msg.style.display = "none"; }, 4000);
    }

    function salvarPais() {
      const index = parseInt(document.getElementById("editIndex").value);
      const dados = {
        bandeira: document.getElementById("bandeira").value || "🌐",
        cidade: document.getElementById("cidade").value,
        moeda: document.getElementById("moeda").value || "$",
        salario: parseFloat(document.getElementById("salario").value) || 0,
        aluguel: parseFloat(document.getElementById("aluguel").value) || 0,
        alimentacao: parseFloat(document.getElementById("alimentacao").value) || 0,
        parcela: parseFloat(document.getElementById("parcela").value) || 0,
        iphone: parseFloat(document.getElementById("iphone").value) || 0,
        entrada: parseFloat(document.getElementById("entrada").value) || 0
      };

      if (index >= 0) baseDados[index] = dados;
      else baseDados.push(dados);

      cancelarEdicao();
      renderizarTabela();
      gravarNoGitHub();
    }

    function removerPais(index) {
      const t = i18n[idiomaAtual];
      if (confirm(`${t.confirmDelete}${baseDados[index].cidade}?`)) {
        baseDados.splice(index, 1);
        renderizarTabela();
        gravarNoGitHub();
      }
    }

    function carregarParaEdicao(index) {
      const item = baseDados[index];
      const t = i18n[idiomaAtual];
      document.getElementById("editIndex").value = index;
      document.getElementById("bandeira").value = item.bandeira || "🌐";
      document.getElementById("cidade").value = item.cidade;
      document.getElementById("moeda").value = item.moeda || "$";
      document.getElementById("salario").value = item.salario;
      document.getElementById("aluguel").value = item.aluguel;
      document.getElementById("alimentacao").value = item.alimentacao;
      document.getElementById("parcela").value = item.parcela;
      document.getElementById("iphone").value = item.iphone;
      document.getElementById("entrada").value = item.entrada;

      document.getElementById("btnSubmit").innerText = t.btnSubmitUpdate;
      document.getElementById("btnCancel").style.display = "inline-block";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelarEdicao() {
      const t = i18n[idiomaAtual];
      document.getElementById("editIndex").value = "-1";
      document.getElementById("btnSubmit").innerText = t.btnSubmitAdd;
      document.getElementById("btnCancel").style.display = "none";
    }

    function salvarToken() {
      const t = document.getElementById("ghToken").value.trim();
      if (t) {
        localStorage.setItem("gh_pat", t);
        document.getElementById("tokenModal").style.display = "none";
        carregarDoGitHub();
      }
    }

    const tipBox = document.getElementById("globalTooltip");
    document.addEventListener("mouseover", (e) => {
      const target = e.target.closest("[data-tip]");
      if (target) {
        const text = target.getAttribute("data-tip");
        if (text) {
          tipBox.innerText = text;
          tipBox.style.display = "block";
          const rect = target.getBoundingClientRect();
          tipBox.style.top = Math.max(10, rect.top - tipBox.offsetHeight - 8) + "px";
          tipBox.style.left = Math.min(window.innerWidth - 290, Math.max(10, rect.left + (rect.width/2) - (tipBox.offsetWidth/2))) + "px";
        }
      }
    });

    document.addEventListener("mouseout", (e) => {
      if (e.target.closest("[data-tip]")) {
        tipBox.style.display = "none";
      }
    });

    const tokenSalvo = localStorage.getItem("gh_pat");
    if (tokenSalvo) document.getElementById("ghToken").value = tokenSalvo;
    mudarIdioma(idiomaAtual);
    carregarDoGitHub();
  </script>
</body>
</html>
